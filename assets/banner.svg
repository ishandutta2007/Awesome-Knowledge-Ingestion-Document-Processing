<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e113a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="purplePill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="pinkPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.15" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
      50% { transform: translate(40px, -20px) scale(1.15); opacity: 0.65; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
      50% { transform: translate(-30px, 30px) scale(1.2); opacity: 0.6; }
    }
    @keyframes pulseOrb3 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(25px, 20px) scale(1.1); opacity: 0.55; }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-12px); opacity: 0.8; }
    }

    .orb-1 { animation: pulseOrb1 9s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb2 12s ease-in-out infinite; }
    .orb-3 { animation: pulseOrb3 8s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 8 12; animation: dashFlow 20s linear infinite; }
    .stream-line-rev { stroke-dasharray: 6 10; animation: dashFlow 16s linear reverse infinite; }
    .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 6s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 5s ease-in-out infinite 2s; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Ambient Orbs (Background) -->
  <g filter="url(#glow)">
    <circle cx="200" cy="90" r="130" fill="#38bdf8" class="orb-1" />
    <circle cx="1020" cy="110" r="140" fill="#a855f7" class="orb-2" />
    <circle cx="620" cy="300" r="120" fill="#f43f5e" class="orb-3" />
  </g>

  <!-- Dynamic Circuit / Pipeline Data Streams (Behind text) -->
  <g fill="none" stroke-width="2" opacity="0.35">
    <path d="M -50,60 Q 250,110 500,70 T 1000,120 T 1250,80" stroke="#38bdf8" class="stream-line" />
    <path d="M -50,300 Q 300,240 600,280 T 1050,230 T 1250,290" stroke="#a855f7" class="stream-line-rev" />
    <path d="M 100,-20 Q 220,180 180,380" stroke="#06b6d4" stroke-width="1.5" class="stream-line" />
    <path d="M 1050,-20 Q 980,180 1060,380" stroke="#ec4899" stroke-width="1.5" class="stream-line-rev" />
  </g>

  <!-- Ambient Floating Data Nodes -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="180" cy="70" r="3" class="particle-1" />
    <circle cx="280" cy="120" r="2.5" class="particle-2" />
    <circle cx="950" cy="80" r="3" class="particle-3" />
    <circle cx="1040" cy="150" r="2" class="particle-1" />
    <circle cx="450" cy="310" r="2.5" class="particle-2" />
    <circle cx="750" cy="320" r="3" class="particle-3" />
  </g>

  <!-- Foreground Content (Solid, Clear, Crisp Contrast) -->
  <!-- Header Badge -->
  <g transform="translate(600, 52)">
    <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="-148" cy="0" r="4" fill="#22c55e" />
    <text x="-134" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">CURATED KNOWLEDGE INGESTION &amp; IDP</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="126" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
    Document Processing &amp; Knowledge Ingestion
  </text>

  <!-- Subtitle -->
  <text x="600" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="url(#subGrad)">
    Enterprise IDP Platforms, LLM-Ready Parsers, OCR Engines &amp; RAG Extraction Pipelines
  </text>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(600, 226)">
    <!-- Pill 1: Multimodal OCR -->
    <g transform="translate(-450, 0)">
      <rect x="0" y="0" width="168" height="40" rx="20" fill="url(#cyanPill)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="84" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0f2fe">🔍 Layout-Aware OCR</text>
    </g>

    <!-- Pill 2: RAG Parsers -->
    <g transform="translate(-262, 0)">
      <rect x="0" y="0" width="168" height="40" rx="20" fill="url(#purplePill)" stroke="#818cf8" stroke-width="1.2" />
      <text x="84" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff">⚡ LLM-Ready Parsers</text>
    </g>

    <!-- Pill 3: VLM & DocTR -->
    <g transform="translate(-74, 0)">
      <rect x="0" y="0" width="150" height="40" rx="20" fill="url(#purplePill)" stroke="#a855f7" stroke-width="1.2" />
      <text x="75" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f3e8ff">🧠 Vision-Language</text>
    </g>

    <!-- Pill 4: Tables & Forms -->
    <g transform="translate(96, 0)">
      <rect x="0" y="0" width="164" height="40" rx="20" fill="url(#pinkPill)" stroke="#f472b6" stroke-width="1.2" />
      <text x="82" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fce7f3">📊 Tables &amp; Structures</text>
    </g>

    <!-- Pill 5: Self-Hosted DMS -->
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="170" height="40" rx="20" fill="url(#cyanPill)" stroke="#06b6d4" stroke-width="1.2" />
      <text x="85" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cffafe">🛡️ Self-Hosted DMS</text>
    </g>
  </g>

  <!-- Bottom Accent / Border Highlight -->
  <line x1="200" y1="310" x2="1000" y2="310" stroke="url(#titleGrad)" stroke-width="1.5" stroke-opacity="0.5" />
</svg>