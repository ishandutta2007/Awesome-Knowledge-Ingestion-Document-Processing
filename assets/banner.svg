<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e113a"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="35%" stop-color="#818cf8"/><stop offset="70%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="subGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient><linearGradient id="cyanPill" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".25"/><stop offset="100%" stop-color="#06b6d4" stop-opacity=".15"/></linearGradient><linearGradient id="purplePill" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#7c3aed" stop-opacity=".25"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".15"/></linearGradient><linearGradient id="pinkPill" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#db2777" stop-opacity=".25"/><stop offset="100%" stop-color="#f43f5e" stop-opacity=".15"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".2" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="30"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/></filter></defs><style>@keyframes pulseOrb1{0%{transform:translate(0,0) scale(1);opacity:.45}50%{transform:translate(40px,-20px) scale(1.15);opacity:.65}}@keyframes pulseOrb2{0%{transform:translate(0,0) scale(1);opacity:.4}50%{transform:translate(-30px,30px) scale(1.2);opacity:.6}}@keyframes pulseOrb3{0%{transform:translate(0,0) scale(1);opacity:.35}50%{transform:translate(25px,20px) scale(1.1);opacity:.55}}@keyframes dashFlow{0%{stroke-dashoffset:200}}@keyframes floatParticle{0%{transform:translateY(0);opacity:.3}50%{transform:translateY(-12px);opacity:.8}}.orb-1{animation:pulseOrb1 9s ease-in-out infinite}.orb-2{animation:pulseOrb2 12s ease-in-out infinite}.orb-3{animation:pulseOrb3 8s ease-in-out infinite}.stream-line{stroke-dasharray:8 12;animation:dashFlow 20s linear infinite}.stream-line-rev{stroke-dasharray:6 10;animation:dashFlow 16s linear reverse infinite}.particle-1{animation:floatParticle 4s ease-in-out infinite}.particle-2{animation:floatParticle 6s ease-in-out infinite 1s}.particle-3{animation:floatParticle 5s ease-in-out infinite 2s}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><g filter="url(#glow)"><circle cx="200" cy="90" r="130" fill="#38bdf8" class="orb-1"/><circle cx="1020" cy="110" r="140" fill="#a855f7" class="orb-2"/><circle cx="620" cy="300" r="120" fill="#f43f5e" class="orb-3"/></g><g fill="none" stroke-width="2" opacity=".35"><path stroke="#38bdf8" d="M -50,60 Q 250,110 500,70 T 1000,120 T 1250,80" class="stream-line"/><path stroke="#a855f7" d="M -50,300 Q 300,240 600,280 T 1050,230 T 1250,290" class="stream-line-rev"/><path stroke="#06b6d4" stroke-width="1.5" d="M 100,-20 Q 220,180 180,380" class="stream-line"/><path stroke="#ec4899" stroke-width="1.5" d="M 1050,-20 Q 980,180 1060,380" class="stream-line-rev"/></g><g fill="#38bdf8" opacity=".6"><circle cx="180" cy="70" r="3" class="particle-1"/><circle cx="280" cy="120" r="2.5" class="particle-2"/><circle cx="950" cy="80" r="3" class="particle-3"/><circle cx="1040" cy="150" r="2" class="particle-1"/><circle cx="450" cy="310" r="2.5" class="particle-2"/><circle cx="750" cy="320" r="3" class="particle-3"/></g><g transform="translate(600, 52)"><rect width="340" height="28" x="-